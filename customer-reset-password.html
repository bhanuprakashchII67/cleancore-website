<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password | CleanCore</title>
<link rel="stylesheet" href="style.css?v=1.50">
<style>
.reset-card{max-width:520px;margin:0 auto}
.reset-card h1{margin-bottom:6px}
.reset-card>p{color:var(--muted);margin-bottom:22px}
.reset-status{min-height:20px}
.reset-success{color:#0b746e!important}
</style>
<link rel="stylesheet" href="desktop.css?v=4.30" media="(min-width:801px)">
<link rel="stylesheet" href="mobile.css?v=2.11" media="(max-width:800px)">
<link rel="stylesheet" href="customer-desktop.css?v=4.40" media="(min-width:801px)">
<link rel="stylesheet" href="customer-mobile.css?v=2.11" media="(max-width:800px)">
</head>
<body class="checkout-page">
<header><div class="container"><nav>
<a class="brand" href="index.html"><img class="site-logo" src="logo.svg" alt="CleanCore logo"><div>CleanCore <span>Chemical & Cleaning</span></div></a>
<div class="navlinks" style="display:flex"><a href="products.html">Products</a><a href="index.html">Home</a></div>
<a class="navcta" href="customer-login.html">Login</a>
</nav></div></header>
<main class="checkout-main"><div class="container">
<section class="checkout-card auth-page-card reset-card">
<div class="eyebrow">Customer account</div>
<h1>Set a new password</h1>
<p>Choose a new password for your CleanCore account.</p>
<form id="resetForm" novalidate>
<label>New password<input id="newPassword" type="password" autocomplete="new-password" minlength="6" placeholder="At least 8 characters" required></label>
<label>Confirm password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Re-enter your password" required></label>
<p id="resetStatus" class="cc-status reset-status" aria-live="polite"></p>
<button id="resetButton" class="btn btn-primary cc-wide" type="submit">Update password <span aria-hidden="true">→</span></button>
</form>
<p class="auth-switch"><a href="customer-login.html">Back to login</a></p>
</section>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://rwfamxkfqslorxcryjrp.supabase.co";
const SUPABASE_KEY="sb_publishable_tzfe2xVn6OAwF-Mh5_u_zQ_a_bAW7tO";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:"cleancore-customer-auth",storage:window.localStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const status=document.getElementById("resetStatus");
const button=document.getElementById("resetButton");
let recoveryReady=false;
async function prepareRecovery(){
  const {data:{session}}=await db.auth.getSession();
  if(session){recoveryReady=true;return true;}
  status.textContent="Open the password reset link from your email again to continue.";
  button.disabled=true;return false;
}
db.auth.onAuthStateChange(async(event,session)=>{
  if(event==="PASSWORD_RECOVERY"||session){recoveryReady=true;button.disabled=false;}
});
prepareRecovery();
document.getElementById("resetForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const p=document.getElementById("newPassword").value;
  const cp=document.getElementById("confirmPassword").value;
  status.className="cc-status reset-status";status.textContent="";
  if(!recoveryReady){status.textContent="Open the password reset link from your email again.";return;}
  if(p.length<8){status.textContent="Password must be at least 6 characters.";return;}
  if(p!==cp){status.textContent="Passwords do not match.";return;}
  button.disabled=true;button.textContent="Updating…";
  const {error}=await db.auth.updateUser({password:p});
  if(error){
    status.textContent=error.message;button.disabled=false;button.innerHTML='Update password <span aria-hidden="true">→</span>';return;
  }
  status.className="cc-status reset-status reset-success";status.textContent="Password updated successfully. Redirecting to login…";
  await db.auth.signOut({scope:"local"});
  setTimeout(()=>location.href="customer-login.html",900);
});
</script>
<script src="error-monitor.js?v=3.7.16"></script></body></html>
