<!doctype html>
<html lang="en">
<head><link rel="icon" href="logo.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="logo.svg"><link rel="icon" href="logo.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="logo.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Login | CleanCore</title>
<link rel="stylesheet" href="style.css?v=1.29"><style>.recovery-status{color:#8a5a00!important;background:#fff7df;border:1px solid #f0d58a;padding:12px 14px;border-radius:12px}.recovery-status::before{content:"Recovery: ";font-weight:800}.forgot-wrap{display:flex;justify-content:flex-end;margin-top:-6px;margin-bottom:10px}.forgot-wrap button{border:0;background:none;color:#0d746e;font:800 13px/1.2 Inter,Arial,sans-serif;padding:4px 0;cursor:pointer}.forgot-wrap button:hover{text-decoration:underline;color:#075f59}.forgot-panel{display:none;margin:10px 0 14px;padding:15px;border:1px solid #dbe7e9;border-radius:14px;background:#f7fbfb}.forgot-panel.open{display:block}.forgot-panel h2{font-size:16px;margin:0 0 4px;color:#0b1f33}.forgot-panel p{font-size:12px;margin:0 0 10px;color:#66727d}.forgot-panel label{display:grid;gap:6px;font-size:12px;font-weight:800;color:#233347}.forgot-panel input{width:100%;box-sizing:border-box;border:1px solid #d6e1e7;border-radius:10px;padding:10px 12px;background:#fff}.forgot-actions{display:flex;gap:8px;margin-top:10px}.forgot-actions button{flex:1}</style><script src="error-monitor.js?v=3.7.16"></script>
</head>
<body class="checkout-page">
<header><div class="container"><nav>
<a class="brand" href="index.html"><img class="site-logo" src="logo.svg" alt="CleanCore logo"><div>CleanCore <span>Chemical & Cleaning</span></div></a>
<div class="navlinks" style="display:flex"><a href="products.html">Products</a><a href="index.html">Home</a></div>
<a class="navcta" href="checkout.html">Cart</a>
</nav></div></header>
<main class="checkout-main">
<div class="container"><div class="auth-page-wrap">
<section class="checkout-card auth-page-card">
<div class="eyebrow">Customer account</div>
<h1>Welcome back</h1>
<p class="cc-muted">Log in with your email address or mobile number and password.</p>
<form id="loginForm" novalidate>
<label>Mobile number<input id="loginPhone" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="10-digit mobile number" required></label>
<label>Email ID<input id="loginEmail" type="email" autocomplete="email" placeholder="your@email.com" required></label>
<label>Password<input id="loginPassword" type="password" autocomplete="current-password" placeholder="Your password" required></label>
<div class="forgot-wrap"><button id="forgotToggle" type="button">Forgot password?</button></div>
<div id="forgotPanel" class="forgot-panel" aria-hidden="true"><h2>Reset your password.</h2><p>Enter the email address saved on your CleanCore account. We’ll send a secure reset link.</p><div id="forgotForm"><label>Email address<input id="forgotEmail" type="text" autocomplete="email" placeholder="you@example.com" required></label><div class="forgot-actions"><button id="forgotCancel" class="btn btn-secondary" type="button">Cancel</button><button id="forgotSend" class="btn btn-primary" type="button">Send reset link</button></div><p id="forgotStatus" class="cc-status" aria-live="polite"></p></div></div>
<p id="loginStatus" class="cc-status" aria-live="polite"></p>
<button id="loginButton" class="btn btn-primary cc-wide" type="submit">Login <span aria-hidden="true">→</span></button>
</form>
<p class="auth-switch">New customer? <a href="customer-signup.html">Create account</a></p>
</section>
</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://rwfamxkfqslorxcryjrp.supabase.co";
const SUPABASE_KEY="sb_publishable_tzfe2xVn6OAwF-Mh5_u_zQ_a_bAW7tO";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:"cleancore-customer-auth",storage:window.localStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const normalize=v=>String(v||"").replace(/\D/g,"").replace(/^91/,"");
const validPhone=v=>/^[6-9]\d{9}$/.test(v);
const getSource=()=>{const q=new URLSearchParams(location.search).get("source");return q||"Landing Page";};
const getNext=()=>{
  const n=new URLSearchParams(location.search).get("next");
  return n==="checkout.html"||n==="account.html"||n==="index.html" ? "./"+n : "./index.html";
};
const forgotToggle=document.getElementById("forgotToggle");
const forgotPanel=document.getElementById("forgotPanel");
const forgotForm=document.getElementById("forgotForm");
const forgotStatus=document.getElementById("forgotStatus");
const forgotSend=document.getElementById("forgotSend");
const forgotCancel=document.getElementById("forgotCancel");
forgotToggle.addEventListener("click",()=>{const open=!forgotPanel.classList.contains("open");forgotPanel.classList.toggle("open",open);forgotPanel.setAttribute("aria-hidden",String(!open));if(open)document.getElementById("forgotEmail").focus();});
forgotCancel.addEventListener("click",()=>{forgotPanel.classList.remove("open");forgotPanel.setAttribute("aria-hidden","true");forgotStatus.textContent="";});
forgotSend.addEventListener("click",async e=>{
  e.preventDefault();
  const email=document.getElementById("forgotEmail").value.trim();
  forgotStatus.className="cc-status";forgotStatus.textContent="";
  if(!email){forgotStatus.textContent="Enter your email address.";return;}
  forgotSend.disabled=true;forgotCancel.disabled=true;forgotSend.textContent="Sending…";
  try{
    const response=await fetch(SUPABASE_URL+"/functions/v1/customer-auth",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY},body:JSON.stringify({action:"request_password_reset",email})});
    const raw=await response.text();let data=null;try{data=raw?JSON.parse(raw):null}catch(_){}
    if(!response.ok)throw new Error(data?.error||"Unable to send reset link right now.");
    forgotStatus.textContent=data?.message||"Check your email for a password reset link.";
  }catch(err){forgotStatus.textContent=err?.message||"Unable to send reset link right now.";}
  finally{forgotSend.disabled=false;forgotCancel.disabled=false;forgotSend.textContent="Send reset link";}
});

document.getElementById("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const status=document.getElementById("loginStatus"),btn=document.getElementById("loginButton");
  const phone=normalize(document.getElementById("loginPhone").value);
  const email=document.getElementById("loginEmail").value.trim().toLowerCase();
  const password=document.getElementById("loginPassword").value;
  if(!validPhone(phone)){status.textContent="Enter your 10-digit mobile number.";return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){status.textContent="Enter a valid email ID.";return;}
  if(!password){status.textContent="Enter your password.";return;}
  btn.disabled=true;status.textContent="Logging in…";
  try{
    const response=await fetch(SUPABASE_URL+"/functions/v1/customer-auth",{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY},
      body:JSON.stringify({action:"login",identifier:phone,email,password,source:getSource()})
    });
    const raw=await response.text();let data=null;
    try{data=raw?JSON.parse(raw):null}catch(_){}
    if(!response.ok){
      const msg=String(data?.error||"");
      status.textContent=msg||"Unable to login right now.";
      const lower=msg.toLowerCase();
      status.classList.toggle("recovery-status",lower.includes("recovery"));
      btn.disabled=false;return;
    }
    if(!data?.session){status.textContent="Login failed. Please try again.";btn.disabled=false;return;}
    const saved=await db.auth.setSession(data.session);
    if(saved.error){status.textContent=saved.error.message;btn.disabled=false;return;}
    window.location.replace(getNext());
  }catch(err){
    status.textContent=err?.message||"Unable to login right now.";
    btn.disabled=false;
  }
});
</script>
<script src="error-monitor.js?v=3.7.16"></script>
</body>
</html>
