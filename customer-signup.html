<html lang="en">
<head><link rel="icon" href="logo.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="logo.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Signup | CleanCore</title>
<link rel="stylesheet" href="style.css?v=1.27">
<style>
.auth-social{display:grid;gap:9px;margin-top:14px}
.auth-divider{display:flex;align-items:center;gap:10px;color:#7b8794;font-size:11px;font-weight:800;margin:12px 0}
.auth-divider::before,.auth-divider::after{content:"";height:1px;background:#e1e8eb;flex:1}
.google-btn{width:100%;min-height:42px;border:1px solid #d5dfe5;border-radius:10px;background:#fff;color:#172b3f;display:flex;align-items:center;justify-content:center;gap:9px;font:800 13px/1 Inter,Arial,sans-serif;cursor:pointer;box-shadow:0 2px 7px rgba(11,31,51,.04);transition:.16s ease}
.google-btn:hover{background:#f8fbfc;border-color:#b9cbd4;box-shadow:0 5px 14px rgba(11,31,51,.07);transform:translateY(-1px)}
.google-g{width:18px;height:18px;display:block}
.auth-social-status{font-size:11px!important;margin:0!important}

<body class="checkout-page">
<header><div class="container"><nav>
<a class="brand" href="index.html"><img class="site-logo" src="logo.svg" alt="CleanCore logo"><div>CleanCore <span>Chemical & Cleaning</span></div></a>
<div class="navlinks" style="display:flex"><a href="products.html">Products</a><a href="index.html">Home</a></div>
<a class="navcta" href="checkout.html">Cart</a>
</nav></div></header>
<main class="checkout-main">
<div class="container"><div class="auth-page-wrap">
<section class="checkout-card auth-page-card">
<div class="eyebrow">Customer account</div>
<h1>Create your account</h1>
<p class="cc-muted">Create your account with email, mobile number and password.</p>
<form id="signupForm" novalidate>
<label>Email ID<input id="signupEmail" type="email" autocomplete="email" placeholder="your@email.com" required></label><label>Mobile number<input id="signupPhone" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="10-digit mobile number" required></label>
<label>Password<input id="signupPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Create a password" required></label>
<p id="signupStatus" class="cc-status" aria-live="polite"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://rwfamxkfqslorxcryjrp.supabase.co";
const SUPABASE_KEY="sb_publishable_tzfe2xVn6OAwF-Mh5_u_zQ_a_bAW7tO";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:"cleancore-customer-auth",storage:window.localStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const normalize=v=>String(v||"").replace(/\D/g,"").replace(/^91/,"");
const validPhone=v=>/^[6-9]\d{9}$/.test(v);
const getSource=()=>new URLSearchParams(location.search).get("source")||"Landing Page";
const getNext=()=>{
  const n=new URLSearchParams(location.search).get("next");
  return n==="checkout.html"||n==="account.html"||n==="index.html" ? "./"+n : "./index.html";
};
document.getElementById("signupForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const status=document.getElementById("signupStatus"),btn=document.getElementById("signupButton");
  const email=document.getElementById("signupEmail").value.trim().toLowerCase();
  const phone=normalize(document.getElementById("signupPhone").value);
  const password=document.getElementById("signupPassword").value;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){status.textContent="Enter a valid email ID.";return;}  if(!validPhone(phone)){status.textContent="Enter your 10-digit mobile number.";return;}
  if(password.length<8){status.textContent="Password must be at least 8 characters.";return;}
  btn.disabled=true;status.textContent="Creating your account…";
  try{
    const response=await fetch(SUPABASE_URL+"/functions/v1/customer-auth",{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY},
      body:JSON.stringify({action:"signup",phone,email,password,source:getSource()})
    });
    const raw=await response.text();let data=null;
    try{data=raw?JSON.parse(raw):null}catch(_){}
    if(!response.ok){
      const msg=String(data?.error||"");
      const friendly=msg.toLowerCase().includes("duplicate key")||msg.toLowerCase().includes("customers_phone_unique")||response.status===409
        ? "This mobile number is already registered. Please login instead."
        : (msg||"Unable to create account.");
      status.textContent=friendly;
      btn.disabled=false;
      return;
    }
    if(!data?.session){status.textContent="Account created. Please login.";btn.disabled=false;return;}
    const saved=await db.auth.setSession(data.session);
    if(saved.error){status.textContent=saved.error.message;btn.disabled=false;return;}
    window.location.replace(getNext());
  }catch(err){
    status.textContent=err?.message||"Unable to create account.";
    btn.disabled=false;
  }
});

document.getElementById("googleSignup").addEventListener("click",async()=>{const gs=document.getElementById("googleSignupStatus");gs.textContent="Opening Google…";const {error}=await db.auth.signInWithOAuth({provider:"google",options:{redirectTo:new URL("customer-auth-callback.html?next="+encodeURIComponent(getNext()),location.href).href}});if(error)gs.textContent=error.message;});
</script>
